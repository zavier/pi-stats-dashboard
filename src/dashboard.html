<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Stats — Local observability</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f10;
      --surface: #141718;
      --surface-raised: #1b1f20;
      --surface-soft: #202526;
      --line: #2b3233;
      --line-bright: #3c4646;
      --ink: #f2f4ee;
      --muted: #a1aaa6;
      --dim: #697371;
      --lime: #c7f36a;
      --lime-dark: #30461e;
      --blue: #8bb9ff;
      --orange: #f3bc72;
      --violet: #d3adff;
      --teal: #74d4c8;
      --red: #ff928d;
      --radius: 12px;
      --space: 8px;
      font: 14px/1.5 "IBM Plex Sans", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

    .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
    .rail { display: flex; flex-direction: column; gap: 44px; padding: 28px 16px 22px; border-right: 1px solid var(--line); background: #111415; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 12px; }
    .mark { width: 25px; height: 25px; border: 5px solid var(--lime); border-radius: 50%; box-shadow: 0 0 0 3px #293722, 0 0 22px #a8d64d33; }
    .brand strong { font-size: 15px; letter-spacing: -.04em; }
    .brand small { display: block; margin-top: -2px; color: var(--dim); font: 10px/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .nav button:hover { background: var(--surface-soft); color: var(--ink); transform: translateX(2px); }
    .nav button[aria-selected="true"] { background: var(--lime); color: #11150f; font-weight: 700; box-shadow: 0 5px 18px #b4e95a1f; }
    .nav button span { width: 17px; color: currentColor; font-size: 15px; text-align: center; }
    .rail-foot { margin-top: auto; padding: 0 12px; color: var(--dim); font: 10px/1.7 "SFMono-Regular", Consolas, monospace; letter-spacing: .1em; }
    .rail-foot b { color: var(--lime); font-weight: 400; }

    .content { width: 100%; padding: 34px clamp(24px, 4vw, 64px) 72px; overflow: hidden; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; max-width: 1480px; margin: 0 auto 42px; }
    .eyebrow, .label { color: var(--dim); font: 700 10px/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: .15em; text-transform: uppercase; }
    .title h1 { max-width: 700px; margin: 8px 0 7px; font-size: clamp(34px, 4vw, 58px); line-height: .98; letter-spacing: -.075em; font-weight: 750; }
    .title p { max-width: 500px; margin: 0; color: var(--muted); }
    .controls { display: flex; align-items: center; gap: 18px; padding-bottom: 3px; }
    .live { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; white-space: nowrap; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px #bce86718, 0 0 12px var(--lime); }
    select { appearance: none; min-width: 126px; padding: 10px 32px 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 11px) 14px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }

    #app { max-width: 1480px; margin: 0 auto; }
    .overview { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .overview h2 { margin: 0; font-size: 18px; letter-spacing: -.035em; }
    .range { margin-top: 3px; color: var(--dim); font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .card { min-height: 135px; padding: 19px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-raised); }
    .card:first-child { border-color: #4f6c2d; background: linear-gradient(140deg, #28371f, #1d281d); }
    .card .value { margin-top: 17px; font-size: clamp(25px, 2.1vw, 32px); line-height: 1; font-weight: 700; letter-spacing: -.06em; }
    .card:first-child .value { color: var(--lime); }
    .sub { margin-top: 8px; color: var(--dim); font-size: 11px; }

    .grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); gap: 12px; margin-top: 12px; }
    .panel { min-width: 0; padding: 21px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 23px; }
    .panel h3 { margin: 0; font-size: 14px; letter-spacing: -.015em; }
    .panel-head small { color: var(--dim); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
    .chart-wrap { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 236px auto; column-gap: 10px; }
    .chart-y { position: relative; width: 46px; color: var(--dim); font: 10px/1 "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    .chart-y span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
    .chart-plot { position: relative; }
    .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
    .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: clamp(4px, 1vw, 12px); }
    .bar-col { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; height: 100%; }
    .bar { display: flex; flex-direction: column; justify-content: flex-end; width: min(100%, 30px); min-height: 2px; overflow: hidden; border-radius: 3px 3px 0 0; transition: filter .15s ease; }
    .bar i { display: block; width: 100%; min-height: 1px; }
    .bar-col:hover .bar { filter: brightness(1.25); }
    .chart-x { grid-column: 2; display: flex; gap: clamp(4px, 1vw, 12px); margin-top: 9px; color: var(--dim); font: 10px "SFMono-Regular", Consolas, monospace; }
    .chart-x span { flex: 1; min-width: 0; overflow: hidden; text-align: center; white-space: nowrap; }
    .hoverline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line-bright); pointer-events: none; }
    .tip { position: absolute; z-index: 3; min-width: 172px; padding: 11px 13px; border: 1px solid var(--line-bright); border-radius: 9px; background: var(--surface-soft); box-shadow: 0 14px 34px #0009; pointer-events: none; }
    .tip b { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 8px; font-size: 12px; }
    .tip .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 2px 0; color: var(--muted); font-size: 11px; }
    .tip .row span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .tip .row em { overflow: hidden; max-width: 150px; text-overflow: ellipsis; white-space: nowrap; font-style: normal; }
    .tip .row i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 15px; color: var(--dim); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .04em; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 9px; height: 9px; border-radius: 2px; }
    .toggle { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-raised); }
    .toggle button { padding: 5px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
    .toggle button[aria-pressed="true"] { background: var(--lime); color: #11150f; font-weight: 700; }
    .grid.wide { grid-template-columns: minmax(0, 1fr); }
    .ghost { padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
    .ghost:hover { border-color: var(--line-bright); color: var(--ink); }
    .banner { max-width: 1480px; margin: 0 auto 18px; padding: 11px 15px; border: 1px solid #6f3b3b; border-radius: 9px; background: #2a1a1a; color: var(--red); font-size: 12px; }
    .table th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
    .table th[data-sort]:hover { color: var(--ink); }
    .foot { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .foot summary { padding: 15px 21px; color: var(--dim); cursor: pointer; font: 700 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .foot[open] summary { border-bottom: 1px solid var(--line); }
    .foot .stat-list { padding: 18px 21px; }
    .foot .note { margin: 0; padding: 0 21px 18px; }
    .stat-list { display: grid; gap: 17px; }
    .stat-line { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .stat-line .name { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .stat-line strong { font-size: 12px; white-space: nowrap; }
    .meter { height: 4px; margin-top: 8px; overflow: hidden; border-radius: 9px; background: var(--line); }
    .meter i { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .section { margin-top: 28px; }
    .section h2 { margin: 0 0 13px; font-size: 18px; letter-spacing: -.035em; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    .table { width: 100%; min-width: 850px; border-collapse: collapse; }
    .table th, .table td { padding: 14px 17px; border-bottom: 1px solid var(--line); text-align: left; }
    .table tr:last-child td { border-bottom: 0; }
    .table th { color: var(--dim); background: var(--surface-raised); font: 700 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .table td:not(:first-child) { color: var(--muted); font-variant-numeric: tabular-nums; }
    .table td:first-child { font-weight: 600; }
    .note { margin: 12px 0 0; color: var(--dim); font-size: 12px; }
    .empty { padding: 38px 16px; border: 1px dashed var(--line-bright); border-radius: 9px; color: var(--muted); text-align: center; }
    .error { color: var(--red); }

    @media (max-width: 850px) {
      .shell { display: block; }
      .rail { gap: 18px; padding: 16px 18px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0; }
      .nav { display: flex; overflow-x: auto; margin: 0 -6px; padding: 2px 6px 4px; }
      .nav button { width: auto; flex: 0 0 auto; white-space: nowrap; }
      .rail-foot { display: none; }
      .content { padding: 28px 18px 48px; }
      .topbar { display: block; margin-bottom: 32px; }
      .controls { justify-content: space-between; margin-top: 24px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 430px) {
      .title h1 { font-size: 37px; }
      .cards { gap: 8px; }
      .card { min-height: 112px; padding: 15px; }
      .card .value { margin-top: 14px; font-size: 24px; }
      .panel { padding: 16px; }
      .chart-wrap { grid-template-rows: 190px auto; }
      .bars, .chart-x { gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="rail">
      <div class="brand"><i class="mark" aria-hidden="true"></i><div><strong>pi / stats</strong><small>local telemetry</small></div></div>
      <nav class="nav" role="tablist" aria-label="Dashboard sections"></nav>
      <div class="rail-foot"><b>●</b> LOCAL ONLY<br>privacy-first telemetry</div>
    </aside>
    <section class="content">
      <div id="banner" class="banner" role="alert" hidden></div>
      <header class="topbar">
        <div class="title"><div class="eyebrow">Local observability / pi agent</div><h1>Usage overview</h1><p>Sessions, models, and token spend — without sending your telemetry anywhere.</p></div>
        <div class="controls"><div class="live"><i aria-hidden="true"></i><span id="synced">SYNCED JUST NOW</span></div><button class="ghost" id="exp-json" type="button">Export JSON</button><button class="ghost" id="exp-csv" type="button">Export CSV</button><label><span class="eyebrow" hidden>Range</span><select id="range" aria-label="Date range"><option value="all">Lifetime</option><option value="today">Today</option><option value="week">Last 7 days</option><option value="month">Last 30 days</option></select></label></div>
      </header>
      <div id="app"></div>
    </section>
  </main>
  <script>
    const token = "__TOKEN__", tabs = [['Overview','◈'],['Models','◇'],['Providers','⌁'],['Projects','▦'],['Agents','◎'],['Tools','⌘'],['Behavior','◌']];
    let data = __DATA__, active = 0, chartDim = 'model', sortKey = 'tokens', sortDir = 1;
    const nav = document.querySelector('.nav'), app = document.querySelector('#app');
    tabs.forEach(([name, icon], i) => { const b = document.createElement('button'); b.innerHTML = `<span aria-hidden="true">${icon}</span>${name}`; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i === 0); b.onclick = () => { active = i; render(); }; nav.append(b); });
    const fmt = n => Intl.NumberFormat().format(Math.round(n || 0)), money = n => { const v = n || 0; return '$' + (v && v < 0.0001 ? v.toFixed(6) : v.toFixed(4)); }, costOf = o => o.priced ? money(o.cost) : '—', esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function cards(o) { return `<div class="cards">${[['Total tokens',fmt(o.tokens),'input + output + cache'],['Requests',fmt(o.requests),'total calls'],['Input tokens',fmt(o.input),'prompt tokens'],['Output tokens',fmt(o.output),'completion tokens'],['Cache reads',fmt(o.cacheRead),'cached input tokens'],['Cache writes',fmt(o.cacheWrite),'cache creation tokens'],['Recorded cost',costOf(o),o.priced ? 'provider estimate' : 'not reported'],['Errors',fmt(o.errors),'failed responses']].map(x => `<article class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></article>`).join('')}</div>`; }
    const SERIES_COLORS = ['#c7f36a','#8bb9ff','#f3bc72','#d3adff','#74d4c8','#ff928d'], OTHER = '__other__';
    const fmtCompact = n => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
    function niceAxis(maxValue) { const raw = Math.max(1, maxValue) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag, step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag, top = Math.max(step, Math.ceil(Math.max(1, maxValue) / step) * step), ticks = []; for (let v = 0; v <= top + step * 1e-6; v += step) ticks.push(v); return { top, ticks }; }
    function chart(range) {
      const dr = (data.daysRange && data.daysRange[range]) || data.days, series = (data.seriesRange && data.seriesRange[range]) || {}, len = range === 'all' ? 14 : range === 'week' ? 7 : range === 'month' ? 30 : 1, end = new Date(); end.setHours(0,0,0,0);
      const entries = Array.from({ length: len }, (_, i) => { const d = new Date(end); d.setDate(end.getDate() - (len - 1 - i)); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return [k, dr[k] || { tokens: 0 }]; });
      const rangeTotal = entries.reduce((a, [, v]) => a + (v.tokens || 0), 0);
      if (!rangeTotal) return `<div class="panel"><div class="panel-head"><h3>Daily activity</h3><small>token usage</small></div><div class="empty">No token usage recorded for this window.</div></div>`;
      const totals = new Map();
      for (const [d] of entries) { const s = (series[d] && series[d][chartDim]) || {}; for (const k in s) totals.set(k, (totals.get(k) || 0) + s[k]); }
      const ranked = [...totals].sort((a, b) => b[1] - a[1]), shown = ranked.slice(0, 6).map(([k]) => k), order = ranked.length > 6 ? [...shown, OTHER] : shown, colorOf = k => k === OTHER ? 'var(--dim)' : SERIES_COLORS[shown.indexOf(k) % SERIES_COLORS.length];
      const valueOf = (s, k) => { if (k !== OTHER) return (s && s[k]) || 0; let sum = 0; for (const kk in s) if (!shown.includes(kk)) sum += s[kk]; return sum; };
      const maxDay = Math.max(1, ...entries.map(([, v]) => v.tokens)), axis = niceAxis(maxDay), labelCount = Math.min(entries.length, 6), labelIdx = new Set(Array.from({ length: labelCount }, (_, k) => Math.round(k * (entries.length - 1) / Math.max(1, labelCount - 1)))), windowLabel = range === 'all' ? 'last 14 days' : range === 'today' ? 'today' : range === 'week' ? 'last 7 days' : 'last 30 days';
      const grid = axis.ticks.map(v => `<span class="gridline" style="top:${(1 - v / axis.top) * 100}%"></span>`).join(''), yLabels = axis.ticks.map(v => `<span style="top:${(1 - v / axis.top) * 100}%">${fmtCompact(v)}</span>`).join('');
      const bars = entries.map(([d, v]) => { const s = (series[d] && series[d][chartDim]) || {}, total = v.tokens || 0, segs = order.map(k => { const val = valueOf(s, k); return val > 0 ? `<i style="height:${val / Math.max(1, total) * 100}%;background:${colorOf(k)}"></i>` : ''; }).join(''), rows = order.map(k => { const val = valueOf(s, k); return val > 0 ? `<div class="row"><span><i style="background:${colorOf(k)}"></i><em>${esc(k === OTHER ? 'Other' : k)}</em></span><strong>${fmt(val)}</strong></div>` : ''; }).join(''); return `<div class="bar-col" role="img" aria-label="${esc(d)}: ${fmt(total)} tokens" data-day="${esc(d)}"><div class="bar" style="height:${Math.max(1, total / axis.top * 100)}%">${segs || '<i style="height:100%;background:var(--line)"></i>'}</div><template class="tip-data"><b><span>${esc(d)}</span><span>${fmt(total)}</span></b>${rows || '<div class="row">No tokens</div>'}</template></div>`; }).join('');
      const xLabels = entries.map(([d], i) => `<span>${labelIdx.has(i) ? d.slice(5) : ''}</span>`).join(''), legend = order.map(k => `<span><i style="background:${colorOf(k)}"></i>${esc(k === OTHER ? 'Other' : k)}</span>`).join('');
      return `<div class="panel"><div class="panel-head"><div><h3>Daily activity</h3><small>${fmt(rangeTotal)} tokens · ${windowLabel}</small></div><div class="toggle" role="group" aria-label="Group by"><button data-dim="model" aria-pressed="${chartDim === 'model'}">Models</button><button data-dim="provider" aria-pressed="${chartDim === 'provider'}">Providers</button></div></div><div class="chart-wrap"><div class="chart-y">${yLabels}</div><div class="chart-plot"><div class="grid">${grid}</div><div class="bars">${bars}</div><div class="hoverline" hidden></div><div class="tip" hidden></div></div><div class="chart-x">${xLabels}</div></div><div class="legend">${legend}</div></div>`;
    }
    function leaders(obj) { const rows = Object.entries(obj).sort((a,b) => b[1].tokens - a[1].tokens).slice(0,5), max = Math.max(1, ...rows.map(([,v]) => v.tokens)); return `<div class="panel"><div class="panel-head"><h3>Top contributors</h3><small>by tokens</small></div>${rows.length ? `<div class="stat-list">${rows.map(([k,v]) => `<div><div class="stat-line"><span class="name">${esc(k)}</span><strong>${fmt(v.tokens)}</strong></div><div class="meter"><i style="width:${v.tokens / max * 100}%"></i></div></div>`).join('')}</div>` : '<div class="empty">No data for this range.</div>'}</div>`; }
    const COLS = [['name','Name'],['requests','Requests'],['input','Input'],['output','Output'],['cacheRead','Cache reads'],['cacheWrite','Cache writes'],['tokens','Tokens'],['cost','Cost'],['errors','Errors']];
    function table(obj) { const rows = Object.entries(obj).sort((a, b) => { if (sortKey === 'name') return sortDir * String(b[0]).localeCompare(String(a[0])); const av = sortKey === 'cost' ? (a[1].cost || 0) : (a[1][sortKey] || 0), bv = sortKey === 'cost' ? (b[1].cost || 0) : (b[1][sortKey] || 0); return sortDir * (bv - av); }); return rows.length ? `<div class="table-wrap"><table class="table"><thead><tr>${COLS.map(([k,label]) => `<th data-sort="${k}" aria-sort="${sortKey === k ? (sortDir === 1 ? 'descending' : 'ascending') : 'none'}">${label}${sortKey === k ? (sortDir === 1 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${fmt(v.requests)}</td><td>${fmt(v.input)}</td><td>${fmt(v.output)}</td><td>${fmt(v.cacheRead)}</td><td>${fmt(v.cacheWrite)}</td><td>${fmt(v.tokens)}</td><td>${costOf(v)}</td><td>${fmt(v.errors)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No records in this view yet.</div>'; }
    function toolTable(obj) { const rows = Object.entries(obj).sort((a,b) => b[1].requests - a[1].requests), total = rows.reduce((a,[,v]) => a + v.requests, 0) || 1; return rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Tool</th><th>Invocations</th><th>Share</th></tr></thead><tbody>${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${fmt(v.requests)}</td><td>${(v.requests / total * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No records in this view yet.</div>'; }
    const BEHAVIOR_DESC = { messages:'user turns', yelling:'all-caps messages', profanity:'profanity hits', anguish:'frustration signals', negation:'corrections / negations', repetition:'repeated asks', blame:'“you did X” phrasing' };
    function behavior(b) { return `<div class="cards">${Object.entries(b).filter(([k]) => k !== 'chars' && k !== 'words').map(([k,v]) => `<article class="card"><div class="label">${esc(k)}</div><div class="value">${fmt(v)}</div><div class="sub">${esc(BEHAVIOR_DESC[k] || '')}</div></article>`).join('')}</div><p class="note">Behavior counters are computed in memory from user messages and cover all recorded sessions (not the selected range). Prompt text is never retained.</p>`; }
    function tokenMix(o) { const parts = [['Input',o.input,'var(--blue)'],['Output',o.output,'var(--lime)'],['Cache read',o.cacheRead,'var(--orange)'],['Cache write',o.cacheWrite,'var(--teal)'],['Reasoning',o.reasoning,'var(--violet)']].filter(x => x[1] > 0), max = Math.max(1, ...parts.map(x => x[1])); return `<div class="panel"><div class="panel-head"><h3>Token mix</h3><small>volume by type</small></div>${parts.length ? `<div class="stat-list">${parts.map(([k,v,c]) => `<div><div class="stat-line"><span class="name">${k}</span><strong>${fmt(v)}</strong></div><div class="meter"><i style="width:${v / max * 100}%;background:${c}"></i></div></div>`).join('')}</div>` : '<div class="empty">No token usage recorded yet.</div>'}${o.reasoning > 0 ? '<p class="note">Reasoning is reported separately and is not part of the token total.</p>' : ''}</div>`; }
    function healthRows() { const d = data.diagnostics || {}; return `<div class="stat-line"><span class="name">Session files scanned</span><strong>${fmt(d.files)}</strong></div><div class="stat-line"><span class="name">Standard sessions</span><strong>${fmt(d.standardSessions)}</strong></div><div class="stat-line"><span class="name">Invalid lines</span><strong class="${d.invalidLines ? 'error' : ''}">${fmt(d.invalidLines)}</strong></div><div class="stat-line"><span class="name">Skipped records</span><strong>${fmt(d.skippedRecords)}</strong></div><div class="stat-line"><span class="name">Unreadable files</span><strong class="${d.unreadableFiles ? 'error' : ''}">${fmt(d.unreadableFiles)}</strong></div>`; }
    function render() { [...nav.children].forEach((b,i) => b.setAttribute('aria-selected', i === active)); const range = document.querySelector('#range').value, o = data.ranges[range] || data.totals.all, by = (data.byRange && data.byRange[range]) || data.by, rangeLabel = document.querySelector('#range').closest('label'), behaviorTab = active === 6; rangeLabel.style.display = behaviorTab ? 'none' : ''; if (active === 0) app.innerHTML = `<div class="overview"><div><h2>Overview</h2><div class="range">${range === 'all' ? 'All recorded time' : `Showing ${range} activity`}</div></div></div>${cards(o)}<div class="grid">${chart(range)}${leaders(by.model)}</div><div class="grid wide">${tokenMix(o)}</div><details class="foot"><summary>Data health &amp; limitations</summary><div class="stat-list">${healthRows()}</div><p class="note">Unsupported historical metrics: latency, TTFT, tokens/sec, and subscription windows.</p></details>`; else if (behaviorTab) app.innerHTML = `<div class="overview"><div><h2>Conversation behavior</h2><div class="range">All recorded time · patterns, not transcripts</div></div></div>${behavior(data.behavior)}`; else { const key = ['model','provider','project','agent','tool'][active - 1]; app.innerHTML = `<div class="overview"><div><h2>${tabs[active][0]}</h2><div class="range">${range === 'all' ? 'All recorded time' : `Showing ${range} activity`}</div></div></div>${key === 'tool' ? toolTable(by.tool) : table(by[key])}<p class="note">${key === 'tool' ? 'Per-tool token/cost attribution is not available; this shows invocation counts.' : 'Unsupported historical metrics: latency, TTFT, tokens/sec, subscription windows.'}</p>`; } }
    let lastSig = '';
    function showBanner(msg) { const b = document.querySelector('#banner'); b.textContent = msg; b.hidden = false; }
    function hideBanner() { document.querySelector('#banner').hidden = true; }
    async function load(force) { if (!force && document.hidden) return; try { const r = await fetch('/api/stats?token=' + encodeURIComponent(token)); if (!r.ok) throw Error('API returned ' + r.status); data = await r.json(); hideBanner(); const sig = JSON.stringify(data); if (sig !== lastSig) { lastSig = sig; const y = window.scrollY; render(); window.scrollTo(0, y); } document.querySelector('#synced').textContent = 'UPDATED ' + new Date(data.generatedAt).toLocaleTimeString(); } catch (e) { showBanner('Unable to load live stats: ' + e.message); document.querySelector('#synced').textContent = 'OFFLINE'; } }
    app.addEventListener('click', e => { const b = e.target.closest('.toggle button'); if (b) { chartDim = b.dataset.dim; render(); return; } const th = e.target.closest('th[data-sort]'); if (th) { const k = th.dataset.sort; if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'name' ? -1 : 1; } render(); } });
    app.addEventListener('mouseover', e => { const col = e.target.closest('.bar-col'); if (col) showTip(col); });
    app.addEventListener('mouseout', e => { const col = e.target.closest('.bar-col'); if (!col) return; if (e.relatedTarget && col.contains(e.relatedTarget)) return; hideTip(col.closest('.chart-plot')); });
    function showTip(col) { const plot = col.closest('.chart-plot'); if (!plot) return; const tip = plot.querySelector('.tip'), line = plot.querySelector('.hoverline'), tpl = col.querySelector('template.tip-data'); if (!tip || !tpl || !line) return; tip.innerHTML = tpl.innerHTML; const pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect(), cx = cr.left - pr.left + cr.width / 2; line.style.left = cx + 'px'; line.hidden = false; tip.hidden = false; const tw = tip.offsetWidth, th = tip.offsetHeight; let left = cx + 14; if (left + tw > pr.width - 4) left = cx - tw - 14; left = Math.max(4, Math.min(left, pr.width - tw - 4)); let top = (cr.top - pr.top) + (cr.height - th) / 2; top = Math.max(4, Math.min(top, pr.height - th - 4)); tip.style.left = left + 'px'; tip.style.top = top + 'px'; }
    function hideTip(plot) { if (!plot) return; const tip = plot.querySelector('.tip'), line = plot.querySelector('.hoverline'); if (tip) tip.hidden = true; if (line) line.hidden = true; }
    function download(name, text, mime) { const url = URL.createObjectURL(new Blob([text], { type: mime })), a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url); }
    function exportJSON() { download(`pi-stats-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data, null, 2), 'application/json'); }
    function exportCSV() { const range = document.querySelector('#range').value, dr = (data.daysRange && data.daysRange[range]) || data.days, keys = ['date','requests','input','output','cacheRead','cacheWrite','tokens','cost'], lines = [keys.join(',')]; for (const [day, v] of Object.entries(dr).sort()) lines.push([day, v.requests, v.input, v.output, v.cacheRead, v.cacheWrite, v.tokens, v.cost].join(',')); download(`pi-stats-${range}-${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'), 'text/csv'); }
    document.querySelector('#range').onchange = render;
    document.querySelector('#exp-json').onclick = exportJSON;
    document.querySelector('#exp-csv').onclick = exportCSV;
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    render(); load(true); setInterval(() => load(), 30000);
  </script>
</body>
